name: Gerar AuditoriaDQ.exe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Teste automático
        env:
          PYTHONIOENCODING: utf-8
          SCREENSHOT_DIR: ${{ runner.temp }}
        run: python testes/teste_rapido.py --janela

      - name: Capturas de tela do teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telas-do-teste
          path: ${{ runner.temp }}/tela-*.png
          if-no-files-found: ignore

      - name: Telas no log (base64)
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem "$env:RUNNER_TEMP\tela-*.png" | ForEach-Object {
            Write-Host "BEGIN-PNG $($_.Name)"
            Write-Host ([Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName)))
            Write-Host "END-PNG"
          }

      - name: Gerar o programa (pasta)
        run: >
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name AuditoriaDQ
          --icon "app\assets\icone.ico"
          --add-data "app\snippets_padrao.json;app"
          --add-data "app\assets;app\assets"
          main.py

      - name: Testar se o .exe abre (e se a segunda cópia só traz a primeira para a frente)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\AuditoriaDQ\AuditoriaDQ.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { Write-Error "O .exe fechou sozinho (código $($p.ExitCode))"; exit 1 }
          $p2 = Start-Process -FilePath "dist\AuditoriaDQ\AuditoriaDQ.exe" -PassThru
          Start-Sleep -Seconds 10
          if (-not $p2.HasExited) { Stop-Process -Id $p2.Id -Force; Write-Error "A segunda cópia não se encerrou"; exit 1 }
          if ($p.HasExited) { Write-Error "A primeira cópia fechou"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Write-Host "O .exe abriu, continuou rodando e a segunda cópia se encerrou."

      - name: Montar o .zip
        shell: pwsh
        run: |
          Copy-Item "distribuicao\COMO INSTALAR.txt" "dist\AuditoriaDQ\"
          Compress-Archive -Path "dist\AuditoriaDQ" -DestinationPath "dist\AuditoriaDQ.zip"
          "{0:N1} MB" -f ((Get-Item "dist\AuditoriaDQ.zip").Length / 1MB)

      - name: Guardar o .zip
        uses: actions/upload-artifact@v4
        with:
          name: AuditoriaDQ
          path: dist/AuditoriaDQ.zip

      - name: Ler versão do programa
        id: versao
        shell: pwsh
        run: |
          $v = (Select-String -Path app/main_window.py -Pattern 'VERSION = "(.+)"').Matches[0].Groups[1].Value
          "tag=v$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" 2>$null
          if ($LASTEXITCODE -eq 0) { "existe=true" >> $env:GITHUB_OUTPUT } else { "existe=false" >> $env:GITHUB_OUTPUT }
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publicar versão nova em Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.versao.outputs.existe == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versao.outputs.tag }}
          name: AuditoriaDQ ${{ steps.versao.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/AuditoriaDQ.zip
          generate_release_notes: true
