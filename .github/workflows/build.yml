name: Gerar AuditoriaDQ.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Teste automático
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
          SCREENSHOT_DIR: ${{ runner.temp }}
        run: python testes/teste_rapido.py

      - name: Capturas de tela do teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telas-do-teste
          path: ${{ runner.temp }}/tela-*.png
          if-no-files-found: ignore

      - name: Gerar o .exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name AuditoriaDQ
          --add-data "app\snippets_padrao.json;app"
          main.py

      - name: Testar se o .exe abre
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\AuditoriaDQ.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { Write-Error "O .exe fechou sozinho (código $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Write-Host "O .exe abriu e continuou rodando."

      - name: Guardar o .exe
        uses: actions/upload-artifact@v4
        with:
          name: AuditoriaDQ
          path: dist/AuditoriaDQ.exe

      - name: Publicar versão (quando houver tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AuditoriaDQ.exe
          generate_release_notes: true
